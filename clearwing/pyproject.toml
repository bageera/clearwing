[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearwing"
version = "0.1.0"
description = "Autonomous LLM-driven security testing and vulnerability research platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
keywords = ["security", "pentest", "llm", "vulnerability", "fuzzing"]
authors = [
    {name = "Clearwing Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

dependencies = [
    "genai-pyo3>=0.1.16",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "starlette>=0.37",
    "networkx>=3.2",
    "scapy>=2.5",
    "docker>=7.0",
    "requests>=2.31",
    "textual>=0.52",
    "rich>=13.7",
    "anyio>=4.3",
    "cryptography>=42.0",
    "urllib3>=2.2",
    "typing-extensions>=4.10",
    "pytest>=8.0",
    "aiohttp>=3.9",
    "attrs>=23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.scripts]
clearwing = "clearwing.ui.cli:main"

[tool.setuptools.packages.find]
include = ["clearwing*"]
exclude = ["venv*", "tests*", "docs*"]

[tool.setuptools.package-data]
clearwing = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"
