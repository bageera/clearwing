blank_issues_enabled: false
contact_links:
  - name: Security vulnerability in Nightwing
    url: https://github.com/Lazarus-AI/nightwing/security/advisories/new
    about: |
      Do NOT file a public issue for security impact. Use GitHub
      Security Advisories — the private disclosure channel. See
      SECURITY.md for the scope and response-time SLA.
  - name: Vulnerability Nightwing found in someone else's software
    url: https://github.com/Lazarus-AI/nightwing/blob/main/SECURITY.md
    about: |
      Vulnerabilities in targets Nightwing scanned are NOT bugs in
      Nightwing — they're expected output. Please report those to
      the affected vendor through their own disclosure channel.
      Nightwing's `--export-disclosures` flag generates MITRE CVE
      and HackerOne templates to help.
