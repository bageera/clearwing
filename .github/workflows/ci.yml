name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package (uv.lock-pinned)
        run: |
          uv sync --frozen --extra dev --python "$(command -v python)"

      - name: Ruff check
        run: uv run --no-sync ruff check nightwing/ tests/

      - name: Ruff format (check)
        run: uv run --no-sync ruff format --check nightwing/ tests/

      - name: Mypy scoped gate
        run: |
          uv run --no-sync mypy --follow-imports=silent \
            nightwing/findings \
            nightwing/sourcehunt \
            nightwing/capabilities.py \
            nightwing/agent/tools \
            nightwing/agent/runtime.py \
            nightwing/agent/protocols.py \
            nightwing/providers/manager.py \
            nightwing/core

      - name: Run pytest with coverage
        run: |
          uv run --no-sync python -m pytest -q --strict-markers --strict-config \
            --cov=nightwing --cov-report=term-missing --cov-report=xml

      - name: Coverage report
        run: uv run --no-sync coverage report --fail-under=65

      - name: Build wheel + sdist
        run: uv run --no-sync python -m build

      - name: Validate artifacts
        run: uv run --no-sync twine check dist/*

  security:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package (uv.lock-pinned)
        run: |
          uv sync --frozen --python "$(command -v python)"

      - name: Dependency audit
        run: |
          uv run --no-sync --with pip-audit pip-audit --strict --desc