name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package
        run: |
          uv pip install --system -e '.[dev]'

      - name: Ruff check
        run: ruff check clearwing/ tests/

      - name: Ruff format (check)
        run: ruff format --check clearwing/ tests/

      - name: Mypy scoped gate
        run: |
          mypy --follow-imports=silent \
            clearwing/findings \
            clearwing/sourcehunt \
            clearwing/capabilities.py \
            clearwing/agent/tools \
            clearwing/core

      - name: Run pytest with coverage
        run: |
          python -m pytest -q --strict-markers --strict-config \
            --cov=clearwing --cov-report=term-missing --cov-report=xml

      - name: Coverage report
        run: coverage report --fail-under=65

      - name: Build wheel + sdist
        run: python -m build

      - name: Validate artifacts
        run: twine check dist/*

  security:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --strict --desc