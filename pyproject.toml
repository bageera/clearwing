[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwing"
version = "1.0.0"
description = "Autonomous vulnerability scanner and source-code hunter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Eric Hartford", email = "eric@quixi.ai" },
]
maintainers = [
    { name = "Eric Hartford", email = "eric@quixi.ai" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Core
    "scapy>=2.5.0",
    "aiohttp>=3.8.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    # Network protocols
    "asyncssh>=2.13.0",
    "pysmb>=1.2.6",
    # Reporting
    "jinja2>=3.1.0",
    "defusedxml>=0.7.0",
    "genai-pyo3>=0.1.16",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    # TUI
    "textual>=0.47.0",
    # Web UI
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
    # Token counting
    "tiktoken>=0.5.0",
    # Knowledge graph
    "networkx>=3.0",
    # Memory
    "numpy>=1.24.0",
    "chromadb>=1.0.0",
    # Source-hunt pipeline — callgraph extraction
    "tree-sitter>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
]

[project.optional-dependencies]
metasploit = ["pymetasploit3>=1.0.0"]
browser = ["playwright>=1.40.0"]
vector = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-httpx>=0.28.0",
    "pytest-randomly>=3.12.0",
    "coverage>=7.0.0",
    "hypothesis>=6.0.0",
    "dirty-equals>=0.7.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.11.0",
    "build>=1.2.0",
    "twine>=6.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "nightwing[metasploit,browser,vector,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/Lazarus-AI/nightwing"
Repository = "https://github.com/Lazarus-AI/nightwing"
Issues = "https://github.com/Lazarus-AI/nightwing/issues"
Documentation = "https://lazarus-ai.github.io/nightwing/"

[project.scripts]
nightwing = "nightwing:main"

[tool.setuptools.packages.find]
include = ["nightwing*"]

[tool.setuptools.package-data]
nightwing = [
    "py.typed",                              # PEP 561 — ship type info to consumers
    "core/config_data/*.yaml",
    "core/skills/vulnerabilities/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--hypothesis-show-statistics"

[tool.coverage.run]
branch = true
source = ["nightwing"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/.reference/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 65

[tool.coverage.html]
directory = "htmlcov"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C90"]
ignore = [
    "E501",   # line-too-long — deferred; many tool docstrings exceed 100
    "B008",   # function calls in default args
    "S101",   # assert — used in test-like code and invariant checks
    "S104",   # binding to all interfaces — intentional for proxy/callback servers
    "S108",   # insecure temp file usage — legitimate in sandbox/tool contexts
    "S110",   # try-except-pass — intentional in cleanup/teardown paths
    "S112",   # try-except-continue — intentional in error-tolerant loops
    "S310",   # audit URL open — security tool makes intentional URL requests
    "S311",   # random not for crypto — used for jitter/obfuscation variable names
    "S324",   # insecure hash — used for non-security purposes (checksums, dedup)
    "S603",   # subprocess without shell=True — core tool functionality
    "S607",   # partial executable path — intentional use of system tools
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E402", "E501", "S"]
"nightwing/sourcehunt/runner.py" = ["C901"]
"nightwing/ui/commands/sourcehunt.py" = ["C901"]
"nightwing/ui/commands/interactive.py" = ["C901"]
"nightwing/ui/web/app.py" = ["C901"]
"nightwing/agent/runtime.py" = ["C901"]
"nightwing/agent/tools/hunt/analysis.py" = ["C901"]
"nightwing/agent/tools/hunt/discovery.py" = ["C901"]
"nightwing/sourcehunt/pool.py" = ["C901"]
"nightwing/sourcehunt/hunter.py" = ["C901"]
"nightwing/sourcehunt/preprocessor.py" = ["C901"]
"nightwing/sourcehunt/reporter.py" = ["C901"]
"nightwing/sourcehunt/campaign.py" = ["C901"]
"nightwing/llm/native.py" = ["C901"]
"nightwing/runners/parallel/executor.py" = ["C901"]
"nightwing/safety/audit/metrics.py" = ["C901"]
"nightwing/analysis/taint_tracker.py" = ["C901"]
"nightwing/ui/tui/app.py" = ["C901"]
"nightwing/sourcehunt/prompts/builders.py" = ["C901"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Scoped mypy gate, built up across phases. Every module here runs with
# `disallow_untyped_defs = true` and `warn_unused_ignores = true` — the
# typed-core policy.
#
#   - nightwing.findings.*          (Phase 3e)
#   - nightwing.capabilities        (Phase 4c)
#   - nightwing.sourcehunt.*        (Phase 5 — ~37 untyped-def errors
#                                    cleaned up via real annotations)
#   - nightwing.agent.tools.*       (Phase 5 — implicit Optional,
#                                    no-any-return, browser-state None
#                                    narrowing, and a handful of real
#                                    arg-type mismatches all fixed)
#   - nightwing.core.*              (Phase 5 — EventBus _handlers/_lock
#                                    class attributes, implicit Optional
#                                    on config/engine/logger/module_loader,
#                                    yaml stub ignore)
[[tool.mypy.overrides]]
module = [
    "nightwing.findings.*",
    "nightwing.capabilities",
    "nightwing.sourcehunt.*",
    "nightwing.agent.tools.*",
    "nightwing.core.*",
    "nightwing.agent.runtime",
    "nightwing.agent.protocols",
    "nightwing.providers.manager",
]
disallow_untyped_defs = true
warn_unused_ignores = true
